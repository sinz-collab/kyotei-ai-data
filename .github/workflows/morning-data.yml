name: Morning race data

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in YYYY-MM-DD. Empty uses JST today."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: morning-race-data
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.schedule_guard.outputs.should_run }}
      target_date: ${{ steps.target.outputs.target_date }}
    steps:
      - id: schedule_guard
        name: Reject stale scheduled run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          now_jst="$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')"
          now_hm="$(TZ=Asia/Tokyo date +%H%M)"
          should_run=true

          # The scheduled run is intended for 06:30 JST.
          # Skip delayed scheduled runs after 09:00 JST.
          # Manual workflow_dispatch runs remain available at any time.
          if [ "$EVENT_NAME" = "schedule" ] && [ $((10#$now_hm)) -gt 900 ]; then
            should_run=false
            echo "Scheduled run skipped because it started after 09:00 JST (${now_jst})."
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Schedule guard"
            echo "- Event: $EVENT_NAME"
            echo "- Current JST: $now_jst"
            echo "- Continue: $should_run"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: target
        if: steps.schedule_guard.outputs.should_run == 'true'
        name: Fix target date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            target_date="$INPUT_DATE"
          else
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          if [[ ! "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "$(date -d "$target_date" +%F 2>/dev/null)" != "$target_date" ]; then
            echo "Invalid target date: $target_date" >&2
            exit 1
          fi
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date" >> "$GITHUB_STEP_SUMMARY"

  fetch:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: east
            venues: "ashiya shimonoseki toda wakamatsu"
          - shard: west
            venues: "tokoname omura karatsu fukuoka heiwajima biwako naruto"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install runtime with retry
        shell: bash
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}: $*"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              fi
            done
            return 1
          }
          retry python -m pip install -r automation/requirements.txt
          retry python -m playwright install --with-deps chromium
      - name: Fetch shard
        shell: bash
        run: |
          failed=0
          for venue in ${{ matrix.venues }}; do
            echo "::group::Fetch ${venue} ${TARGET_DATE}"
            if ! python automation/fetch_one.py --venue "$venue" --date "$TARGET_DATE"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload shard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-${{ matrix.shard }}-${{ needs.prepare.outputs.target_date }}
          path: |
            work/races/**/fetch_status.json
            work/races/**/tide_today.json
            work/races/**/races/*_entry.txt
            work/races/**/races/*_data.txt
            work/races/**/races/*_motor.txt
            work/races/**/races/*_boaters_local_st.json
          if-no-files-found: warn
          retention-days: 2

  publish:
    needs: [prepare, fetch]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore official six-month course database
        uses: actions/cache@v4
        with:
          path: data/player_course_6m/player_course_6m.sqlite
          key: player-course-6m-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            player-course-6m-${{ runner.os }}-

      - name: Install prediction dependencies
        run: |
          python -m pip install lxml==6.0.0
          python -m pip install lhafile==0.3.1
          python -m pip install -r engines/ashiya/ashiya_engine_v1_6/requirements.txt
        
      - name: Download east shard artifact
        uses: actions/download-artifact@v4
        with:
          name: morning-east-${{ needs.prepare.outputs.target_date }}
          path: work/artifacts/east
      - name: Download west shard artifact
        uses: actions/download-artifact@v4
        with:
          name: morning-west-${{ needs.prepare.outputs.target_date }}
          path: work/artifacts/west
      - name: Validate and merge shard artifacts
        shell: bash
        run: |
          python automation/prepare_morning_artifacts.py \
            --date "$TARGET_DATE" \
            --east work/artifacts/east \
            --west work/artifacts/west \
            --output work/races
      - name: Validate and publish public data
        shell: bash
        run: bash automation/publish_morning_data.sh "$TARGET_DATE"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-report-${{ needs.prepare.outputs.target_date }}
          path: |
            build-*.log
            data/morning_report.json
            work/races/**/fetch_status.json
          if-no-files-found: warn
          retention-days: 2
