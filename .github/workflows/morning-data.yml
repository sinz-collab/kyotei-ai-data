name: Morning race data

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in YYYY-MM-DD. Empty uses JST today."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: morning-race-data
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.schedule_guard.outputs.should_run }}
      target_date: ${{ steps.target.outputs.target_date }}
    steps:
      - id: schedule_guard
        name: Reject stale scheduled run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          now_jst="$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')"
          now_hm="$(TZ=Asia/Tokyo date +%H%M)"
          should_run=true

          # The scheduled run is intended for 06:30 JST.
          # Skip delayed scheduled runs after 09:00 JST.
          # Manual workflow_dispatch runs remain available at any time.
          if [ "$EVENT_NAME" = "schedule" ] && [ $((10#$now_hm)) -gt 900 ]; then
            should_run=false
            echo "Scheduled run skipped because it started after 09:00 JST (${now_jst})."
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Schedule guard"
            echo "- Event: $EVENT_NAME"
            echo "- Current JST: $now_jst"
            echo "- Continue: $should_run"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: target
        if: steps.schedule_guard.outputs.should_run == 'true'
        name: Fix target date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            target_date="$INPUT_DATE"
          else
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          if [[ ! "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "$(date -d "$target_date" +%F 2>/dev/null)" != "$target_date" ]; then
            echo "Invalid target date: $target_date" >&2
            exit 1
          fi
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date" >> "$GITHUB_STEP_SUMMARY"

  fetch:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: east
            venues: "ashiya shimonoseki toda edogawa wakamatsu"
          - shard: west
            venues: "tokoname omura karatsu fukuoka heiwajima biwako"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install runtime with retry
        shell: bash
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}: $*"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              fi
            done
            return 1
          }
          retry python -m pip install -r automation/requirements.txt
          retry python -m playwright install --with-deps chromium
      - name: Fetch shard
        shell: bash
        run: |
          failed=0
          for venue in ${{ matrix.venues }}; do
            echo "::group::Fetch ${venue} ${TARGET_DATE}"
            if ! python automation/fetch_one.py --venue "$venue" --date "$TARGET_DATE"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload shard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-${{ matrix.shard }}-${{ needs.prepare.outputs.target_date }}
          path: |
            work/races/**/fetch_status.json
            work/races/**/tide_today.json
            work/races/**/races/*_entry.txt
            work/races/**/races/*_data.txt
            work/races/**/races/*_motor.txt
            work/races/**/races/*_boaters_local_st.json
          if-no-files-found: warn
          retention-days: 2

  publish:
    needs: [prepare, fetch]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prediction dependencies
        run: |
          python -m pip install pandas==2.3.1
          python -m pip install -r engines/ashiya/ashiya_engine_v1_6/requirements.txt
        
      - name: Download current run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: morning-*-${{ needs.prepare.outputs.target_date }}
          path: work/races
          merge-multiple: true
      - name: Build and validate public data
        shell: bash
        run: |
          cp -a data "$RUNNER_TEMP/morning-data-before"
          python -m unittest discover -s tests
          python automation/build_site_data.py --date "$TARGET_DATE" | tee build.log
          python automation/enrich_motor_recent.py --date "$TARGET_DATE"
          python automation/enrich_all_venues_kimarite.py --date "$TARGET_DATE"
          python automation/apply_toda_v5.py --date "$TARGET_DATE"
          python automation/apply_heiwajima_v1.py --date "$TARGET_DATE"
          python automation/apply_karatsu_v1.py --date "$TARGET_DATE"
          python automation/apply_wakamatsu_v2.py --date "$TARGET_DATE"
          python automation/apply_omura_v1.py --date "$TARGET_DATE"
          python automation/run_ashiya_v16.py --date "$TARGET_DATE" --stage pre
          python automation/run_biwako_v1_2.py --date "$TARGET_DATE" --stage preliminary
          python automation/run_shimonoseki_v6_1.py --date "$TARGET_DATE" --stage preliminary

          python automation/build_site_data.py --date "$TARGET_DATE" \
            | tee build-after-engine.log
          python automation/enrich_motor_recent.py --date "$TARGET_DATE"
          python automation/enrich_all_venues_kimarite.py --date "$TARGET_DATE"
          python automation/validate_morning_regression.py \
            --before "$RUNNER_TEMP/morning-data-before" \
            --after data
          {
            echo "## Morning data report"
            echo '```json'
            cat data/morning_report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push public data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd data

            rm -rf "$RUNNER_TEMP/morning-data-before-publish"
            cp -a data "$RUNNER_TEMP/morning-data-before-publish"

            python automation/build_site_data.py --date "$TARGET_DATE" \
              | tee "build-after-sync-${attempt}.log"
            python automation/enrich_motor_recent.py --date "$TARGET_DATE"
            python automation/enrich_all_venues_kimarite.py --date "$TARGET_DATE"
            python automation/apply_toda_v5.py --date "$TARGET_DATE"
            python automation/apply_heiwajima_v1.py --date "$TARGET_DATE"
            python automation/apply_karatsu_v1.py --date "$TARGET_DATE"
            python automation/apply_wakamatsu_v2.py --date "$TARGET_DATE"
            python automation/apply_omura_v1.py --date "$TARGET_DATE"
            python automation/run_ashiya_v16.py --date "$TARGET_DATE" --stage pre
            python automation/run_biwako_v1_2.py --date "$TARGET_DATE" --stage preliminary
          python automation/run_shimonoseki_v6_1.py --date "$TARGET_DATE" --stage preliminary

            python automation/build_site_data.py --date "$TARGET_DATE" \
              | tee "build-after-engine-${attempt}.log"
            python automation/enrich_motor_recent.py --date "$TARGET_DATE"
            python automation/enrich_all_venues_kimarite.py --date "$TARGET_DATE"
            python automation/validate_morning_regression.py \
              --before "$RUNNER_TEMP/morning-data-before-publish" \
              --after data

            git add data
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi

            git commit -m "Update morning race data ${TARGET_DATE}"

            if git push origin HEAD:main; then
              echo "Morning data published successfully."
              exit 0
            fi

            echo "Push was rejected because main changed; rebuilding from latest main."
            git reset --hard origin/main

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "Morning data publish failed after 5 attempts." >&2
          exit 1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-report-${{ needs.prepare.outputs.target_date }}
          path: |
            build.log
            build-after-sync-*.log
            data/morning_report.json
            work/races/**/fetch_status.json
          if-no-files-found: warn
          retention-days: 2
