name: Morning race data

on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in YYYY-MM-DD. Empty uses JST today."
        required: false
        type: string
      scope:
        description: "Manual recovery scope"
        required: true
        default: failed
        type: choice
        options:
          - failed
          - all

permissions:
  contents: write

concurrency:
  group: morning-race-data
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.schedule_guard.outputs.should_run }}
      run_mode: ${{ steps.schedule_guard.outputs.run_mode }}
      target_date: ${{ steps.target.outputs.target_date }}
    steps:
      - id: schedule_guard
        name: Enforce JST morning start window
        shell: bash
        run: |
          now_jst="$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M:%S %Z')"
          now_hm="$(TZ=Asia/Tokyo date +%H%M)"
          should_run=false
          run_mode=automatic
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            should_run=true
            run_mode="recovery-${{ inputs.scope }}"
          elif [ $((10#$now_hm)) -ge 600 ] && [ $((10#$now_hm)) -le 645 ]; then
            should_run=true
          else
            echo "Morning run skipped outside 06:00-06:45 JST (${now_jst})."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "run_mode=$run_mode" >> "$GITHUB_OUTPUT"
          {
            echo "## Schedule guard"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Mode: $run_mode"
            echo "- Current JST: $now_jst"
            echo "- Continue: $should_run"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: target
        if: steps.schedule_guard.outputs.should_run == 'true'
        name: Fix target date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          target_date="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          if [[ ! "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
             [ "$(date -d "$target_date" +%F 2>/dev/null)" != "$target_date" ]; then
            echo "Invalid target date: $target_date" >&2
            exit 1
          fi
          if [ "$target_date" != "$(TZ=Asia/Tokyo date +%F)" ]; then
            echo "Production target date must be today in JST." >&2
            exit 1
          fi
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Target date: $target_date" >> "$GITHUB_STEP_SUMMARY"

  fetch:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.run_mode == 'automatic'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: east
            venues: "kiryu ashiya shimonoseki toda wakamatsu"
          - shard: west
            venues: "tokoname omura karatsu fukuoka heiwajima biwako naruto"
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/write_morning_fetch_status.py
            automation/venues.json
            deploy/morning-vps/sinz-morning-exec
          sparse-checkout-cone-mode: false
      - name: Configure pinned VPS SSH host
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          VPS_KEY: ${{ secrets.MORNING_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.MORNING_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/morning-vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/morning-vps" "$HOME/.ssh/known_hosts"
          test -n "$VPS_HOST"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Verify deployed VPS executor version
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
        run: |
          expected="$(sha256sum deploy/morning-vps/sinz-morning-exec | awk '{print $1}')"
          actual="$(ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 "sinz-morning-gateway@$VPS_HOST" version)"
          [ "$actual" = "$expected" ] || {
            echo "VPS executor version does not match the checked-out commit." >&2
            exit 78
          }

      - name: Fetch shard on isolated VPS runtime
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          SHARD: ${{ matrix.shard }}
          VENUES: ${{ matrix.venues }}
        run: |
          artifact_root="work/vps-artifact/work/races"
          mkdir -p "$artifact_root"
          archive="$RUNNER_TEMP/morning-${SHARD}.tgz"
          deadline="$(TZ=Asia/Tokyo date -d "$TARGET_DATE 08:18" +%s)"
          remaining=$((deadline - $(date +%s)))
          rc=69
          if [ "$remaining" -gt 0 ]; then
            set +e
            timeout --signal=TERM --kill-after=20s "${remaining}s" \
              ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=10 -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                "sinz-morning-gateway@$VPS_HOST" \
                "fetch $TARGET_DATE $SHARD" > "$archive"
            rc=$?
            set -e
          fi

          if [ "$rc" -eq 0 ] && tar -tzf "$archive" >/dev/null 2>&1; then
            tar -xzf "$archive" -C work/vps-artifact
          else
            echo "VPS shard transfer failed safely: shard=$SHARD rc=$rc" >&2
            for venue in $VENUES; do
              python automation/write_morning_fetch_status.py \
                --venue "$venue" --date "$TARGET_DATE" \
                --root "$artifact_root" --reason vps_transport_failed
            done
          fi

      - name: Upload shard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-${{ matrix.shard }}-${{ needs.prepare.outputs.target_date }}
          path: |
            work/vps-artifact/work/races/**/fetch_status.json
            work/vps-artifact/work/races/**/tide_today.json
            work/vps-artifact/work/races/**/races/*_entry.txt
            work/vps-artifact/work/races/**/races/*_entry.html
            work/vps-artifact/work/races/**/races/*_data.txt
            work/vps-artifact/work/races/**/races/*_motor.txt
            work/vps-artifact/work/races/**/races/*_boaters_local_st.json
          if-no-files-found: error
          retention-days: 2

  recover:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && startsWith(needs.prepare.outputs.run_mode, 'recovery-')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
      RECOVERY_ACTION: ${{ needs.prepare.outputs.run_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            automation/write_morning_fetch_status.py
            automation/venues.json
            deploy/morning-vps/sinz-morning-exec
          sparse-checkout-cone-mode: false
      - name: Configure pinned VPS SSH host
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          VPS_KEY: ${{ secrets.MORNING_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.MORNING_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/morning-vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/morning-vps" "$HOME/.ssh/known_hosts"
          test -n "$VPS_HOST"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Verify deployed VPS executor version
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
        run: |
          expected="$(sha256sum deploy/morning-vps/sinz-morning-exec | awk '{print $1}')"
          actual="$(ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 "sinz-morning-gateway@$VPS_HOST" version)"
          [ "$actual" = "$expected" ] || {
            echo "VPS executor version does not match the checked-out commit." >&2
            exit 78
          }

      - name: Recover venues sequentially on isolated VPS runtime
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
        run: |
          mkdir -p work/recovery/east work/recovery/west
          for shard in east west; do
            archive="$RUNNER_TEMP/morning-recovery-${shard}.tgz"
            timeout --signal=TERM --kill-after=20s 26m \
              ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=10 -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                "sinz-morning-gateway@$VPS_HOST" \
                "$RECOVERY_ACTION $TARGET_DATE $shard" > "$archive"
            tar -tzf "$archive" >/dev/null
            tar -xzf "$archive" -C "work/recovery/$shard"
          done

      - name: Upload east recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-east-${{ needs.prepare.outputs.target_date }}
          path: work/recovery/east/work/races
          if-no-files-found: error
          retention-days: 2
      - name: Upload west recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-west-${{ needs.prepare.outputs.target_date }}
          path: work/recovery/west/work/races
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [prepare, fetch, recover]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
      MORNING_RECOVERY_MODE: ${{ startsWith(needs.prepare.outputs.run_mode, 'recovery-') && inputs.scope || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore official six-month course database
        uses: actions/cache@v4
        with:
          path: data/player_course_6m/player_course_6m.sqlite
          key: player-course-6m-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            player-course-6m-${{ runner.os }}-

      - name: Install prediction dependencies
        run: |
          python -m pip install lxml==6.0.0
          python -m pip install lhafile==0.3.1
          python -m pip install catboost==1.2.10
          python -m pip install -r engines/ashiya/ashiya_engine_v1_6/requirements.txt

      - name: Download east shard artifact
        uses: actions/download-artifact@v4
        with:
          name: morning-east-${{ needs.prepare.outputs.target_date }}
          path: work/artifacts/east
      - name: Download west shard artifact
        uses: actions/download-artifact@v4
        with:
          name: morning-west-${{ needs.prepare.outputs.target_date }}
          path: work/artifacts/west
      - name: Validate and merge shard artifacts
        shell: bash
        run: |
          python automation/prepare_morning_artifacts.py \
            --date "$TARGET_DATE" \
            --east work/artifacts/east \
            --west work/artifacts/west \
            --output work/races
          python automation/validate_morning_vps_artifacts.py \
            --date "$TARGET_DATE" --root work/races
      - name: Validate and publish public data
        shell: bash
        run: bash automation/publish_morning_data.sh "$TARGET_DATE"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-report-${{ needs.prepare.outputs.target_date }}
          path: |
            build-*.log
            data/morning_report.json
            work/races/**/fetch_status.json
          if-no-files-found: warn
          retention-days: 2
