name: Test Karatsu engine

on:
  workflow_dispatch:

jobs:
  test-karatsu:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Karatsu engine
        run: |
          python automation/apply_karatsu_v1.py --date 2026-07-30

      - name: Verify Karatsu JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/venues/karatsu/20260730.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          assert payload["engine"] == "karatsu_scenario_engine_v1_0"
          assert set(payload["preds"]) == {str(i) for i in range(1, 13)}

          for race_no in range(1, 13):
              prediction = payload["preds"][str(race_no)]
              assert prediction["status"] == "complete"
              assert prediction["engine"] == "karatsu_scenario_engine_v1_0"
              assert prediction["sab"]
              assert prediction["ai"] or prediction["aiUpset"]

          print("Karatsu engine JSON OK")
          PY
