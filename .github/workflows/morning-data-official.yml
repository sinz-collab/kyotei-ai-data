name: 朝のレースデータ【公式出走表】

on:
  workflow_run:
    workflows: ["Morning race data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date (YYYY-MM-DD)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: morning-official-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Select safe official fallback scope
        id: scope
        env:
          REQUESTED_DATE: "${{ inputs.date }}"
        run: |
          test "$GITHUB_REF" = refs/heads/main
          TARGET_DATE="${REQUESTED_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$(date -d "$TARGET_DATE" +%F 2>/dev/null)" = "$TARGET_DATE"
          test "$TARGET_DATE" = "$(TZ=Asia/Tokyo date +%F)"
          TARGET_VENUES=all
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            if [ "${{ github.event.workflow_run.head_branch }}" != main ]; then
              echo "active=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Start only early enough that the whole fetch can finish before 08:15.
            now_hm="$(TZ=Asia/Tokyo date +%H%M)"
            if [ $((10#$now_hm)) -lt 600 ] || [ $((10#$now_hm)) -gt 715 ]; then
              echo "active=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TARGET_VENUES="$(python automation/select_official_recovery_venues.py --date "$TARGET_DATE")"
            if [ -z "$TARGET_VENUES" ]; then
              echo "active=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "TARGET_VENUES=$TARGET_VENUES" >> "$GITHUB_ENV"
          echo "Official target: $TARGET_DATE ($TARGET_VENUES)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install official parsing and prediction dependencies
        if: steps.scope.outputs.active == 'true'
        run: |
          python -m pip install beautifulsoup4==4.13.4
          python -m pip install lxml==6.0.0 lhafile==0.3.1 catboost==1.2.10
      - name: Restore successful official race cache
        if: steps.scope.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/official-morning-cache
          key: official-morning-${{ env.TARGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: official-morning-${{ env.TARGET_DATE }}-
      - name: Acquire and validate official cards
        if: steps.scope.outputs.active == 'true'
        id: official
        run: |
          set +e
          deadline="$(TZ=Asia/Tokyo date -d "$TARGET_DATE 08:15" +%s)"
          remaining=$((deadline - $(date +%s)))
          test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=20s "${remaining}s" \
            python automation/official_morning.py \
            --date "$TARGET_DATE" --venues "$TARGET_VENUES" --races all \
            --baseline-root data/venues --output-root work/official-stage \
            --cache-root work/official-morning-cache \
            --course-db data/player_course_6m/player_course_6m.sqlite \
            --course-class-cache data/player_course_6m/racer_classes.json \
            --allow-partial-supplements --min-interval 1.0 --timeout 25
          echo "validation_exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('work/official-stage/report.json').read_text(encoding='utf-8'))
          print('held='+' '.join(r['summary']['heldVenues']))
          print('complete='+' '.join(r['summary']['completeVenues']))
          PY
          test -n "${{ steps.official.outputs.complete }}" || \
            test -n "$(find work/official-stage/candidates -name '*.json' -print -quit)"
      - name: Publish complete official venues first
        if: steps.scope.outputs.active == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          python automation/publish_official_stages.py \
            --date "$TARGET_DATE" --stage official \
            --candidate-root work/official-stage/candidates \
            --report work/official-publish-report.json
          git add data/manifest.json data/morning_report.json data/venues
          if ! git diff --cached --quiet; then
            git commit -m "data: publish validated official cards for $TARGET_DATE"
            git push origin HEAD:main
          fi
      - name: Generate missing preliminary predictions from official cards
        if: steps.scope.outputs.active == 'true'
        run: |
          python automation/run_official_predictions.py --date "$TARGET_DATE" \
            | tee work/official-prediction-report.json
          git add data/manifest.json data/morning_report.json data/venues
          if ! git diff --cached --quiet; then
            git commit -m "data: fill missing official predictions for $TARGET_DATE"
            git push origin HEAD:main
          fi
      - name: Configure pinned VPS SSH host
        if: steps.scope.outputs.active == 'true' && github.event_name == 'workflow_dispatch'
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          VPS_KEY: ${{ secrets.MORNING_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.MORNING_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/morning-vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/morning-vps" "$HOME/.ssh/known_hosts"
          test -n "$VPS_HOST"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Reuse cache and retrieve only missing BOATERS races
        if: steps.scope.outputs.active == 'true' && github.event_name == 'workflow_dispatch'
        id: supplement
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          TARGET_DATE: ${{ env.TARGET_DATE }}
          COMPLETE_VENUES: ${{ steps.official.outputs.complete }}
        run: |
          expected="$(printf 'executor=%s\nboaters=%s\nbrowser_identity=%s\nsupplement_validator=%s\nkimarite_parser=%s\nmotor_parser=%s\n' \
            "$(sha256sum deploy/morning-vps/sinz-morning-exec|awk '{print $1}')" \
            "$(sha256sum automation/boaters_fetch.py|awk '{print $1}')" \
            "$(sha256sum automation/browser_identity.py|awk '{print $1}')" \
            "$(sha256sum automation/validate_boaters_supplement.py|awk '{print $1}')" \
            "$(sha256sum automation/enrich_all_venues_kimarite.py|awk '{print $1}')" \
            "$(sha256sum automation/enrich_motor_recent.py|awk '{print $1}')")"
          actual="$(ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "sinz-morning-gateway@$VPS_HOST" supplement-version)"
          test "$actual" = "$expected"
          mkdir -p work/official-boaters
          failures=0
          for venue in $COMPLETE_VENUES; do
            races="$(python - "$venue" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path('work/official-stage/report.json').read_text(encoding='utf-8'))
          print(','.join(map(str,r['venues'][sys.argv[1]].get('missingSupplementRaces',[]))))
          PY
            )"
            [ -n "$races" ] || continue
            archive="$RUNNER_TEMP/official-boaters-${venue}.tgz"
            set +e
            timeout --signal=TERM --kill-after=20s 2100s \
              ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
                "sinz-morning-gateway@$VPS_HOST" "supplement $TARGET_DATE $venue $races" > "$archive"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || ! tar -tzf "$archive" >/dev/null 2>&1; then
              echo "BOATERS stopped safely: venue=$venue rc=$rc" >&2
              failures=$((failures+1))
              continue
            fi
            tar -xzf "$archive" -C work/official-boaters
          done
          echo "failure_count=$failures" >> "$GITHUB_OUTPUT"
      - name: Validate cached BOATERS additions without network
        if: steps.scope.outputs.active == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          set +e
          python automation/official_morning.py \
            --date "$TARGET_DATE" --venues "$TARGET_VENUES" --races all \
            --baseline-root data/venues --output-root work/supplement-stage \
            --cache-root work/official-morning-cache \
            --boaters-root work/official-boaters/work/races \
            --course-db data/player_course_6m/player_course_6m.sqlite \
            --course-class-cache data/player_course_6m/racer_classes.json \
            --allow-partial-supplements --cache-only
          set -e
      - name: Publish individually validated BOATERS fields
        if: steps.scope.outputs.active == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          git pull --rebase origin main
          python automation/publish_official_stages.py \
            --date "$TARGET_DATE" --stage supplement \
            --candidate-root work/supplement-stage/candidates \
            --report work/supplement-publish-report.json
          git add data/manifest.json data/morning_report.json data/venues
          if ! git diff --cached --quiet; then
            git commit -m "data: add validated BOATERS fields for $TARGET_DATE"
            git push origin HEAD:main
          fi
      - name: Fill remaining predictions after BOATERS validation
        if: steps.scope.outputs.active == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          python automation/run_official_predictions.py --date "$TARGET_DATE" --stage supplement \
            | tee work/supplement-prediction-report.json
          git add data/manifest.json data/morning_report.json data/venues
          if ! git diff --cached --quiet; then
            git commit -m "data: fill predictions after supplement for $TARGET_DATE"
            git push origin HEAD:main
          fi
      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-official-publication-${{ env.TARGET_DATE }}
          path: |
            work/official-stage/report.json
            work/official-publish-report.json
            work/official-prediction-report.json
            work/supplement-stage/report.json
            work/supplement-publish-report.json
            work/supplement-prediction-report.json
            work/official-morning-cache/**/*.json
            work/official-boaters/work/races/**
          if-no-files-found: warn
          retention-days: 7
      - name: Save successful official race cache
        if: always() && steps.scope.outputs.active == 'true'
        uses: actions/cache/save@v4
        with:
          path: work/official-morning-cache
          key: official-morning-${{ env.TARGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
