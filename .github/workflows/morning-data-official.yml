name: 朝のレースデータ【公式出走表】

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Validation date (YYYY-MM-DD)"
        required: true
        default: "2026-11-18"
        type: string

permissions:
  contents: read

concurrency:
  group: morning-official-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Build isolated official candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard manual validation input
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$(date -d "$TARGET_DATE" +%F 2>/dev/null)" = "$TARGET_DATE"
          test "$TARGET_DATE" = "$(TZ=Asia/Tokyo date +%F)"
      - name: Install parser dependency
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Restore successful official race cache
        uses: actions/cache/restore@v4
        with:
          path: work/official-morning-cache
          key: official-morning-${{ inputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            official-morning-${{ inputs.date }}-
      - name: Detect held venues and cache all official cards
        id: detect
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set +e
          python automation/official_morning.py \
            --date "$TARGET_DATE" --venues all --races all \
            --baseline-root data/venues \
            --output-root work/official-detection \
            --cache-root work/official-morning-cache \
            --course-db data/player_course_6m/player_course_6m.sqlite \
            --course-class-cache data/player_course_6m/racer_classes.json \
            --min-interval 1.0 --timeout 25
          set -e
          held="$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('work/official-detection/report.json').read_text(encoding='utf-8'))
          print(' '.join(report.get('summary', {}).get('heldVenues', [])))
          PY
          )"
          test -n "$held"
          echo "held=$held" >> "$GITHUB_OUTPUT"
      - name: Configure pinned VPS SSH host
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          VPS_KEY: ${{ secrets.MORNING_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.MORNING_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/morning-vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/morning-vps" "$HOME/.ssh/known_hosts"
          test -n "$VPS_HOST"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Reuse cache and retrieve missing BOATERS races
        id: supplement
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          TARGET_DATE: ${{ inputs.date }}
          HELD_VENUES: ${{ steps.detect.outputs.held }}
        run: |
          expected="$(printf 'executor=%s\nboaters=%s\nsupplement_validator=%s\n' \
            "$(sha256sum deploy/morning-vps/sinz-morning-exec | awk '{print $1}')" \
            "$(sha256sum automation/boaters_fetch.py | awk '{print $1}')" \
            "$(sha256sum automation/validate_boaters_supplement.py | awk '{print $1}')")"
          actual="$(ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "sinz-morning-gateway@$VPS_HOST" supplement-version)"
          test "$actual" = "$expected"
          mkdir -p work/official-boaters
          races="$(seq -s, 1 12)"
          supplement_rc=0
          for venue in $HELD_VENUES; do
            archive="$RUNNER_TEMP/official-boaters-${venue}.tgz"
            set +e
            timeout --signal=TERM --kill-after=20s 2100s \
              ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
                "sinz-morning-gateway@$VPS_HOST" \
                "supplement $TARGET_DATE $venue $races" > "$archive"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || ! tar -tzf "$archive" >/dev/null 2>&1; then
              echo "BOATERS supplement stopped safely: venue=$venue rc=$rc" >&2
              supplement_rc="${rc:-70}"
              break
            fi
            tar -xzf "$archive" -C work/official-boaters
          done
          echo "exit_code=$supplement_rc" >> "$GITHUB_OUTPUT"
      - name: Build and validate final isolated candidates
        id: final
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set +e
          python automation/official_morning.py \
            --date "$TARGET_DATE" --venues all --races all \
            --baseline-root data/venues \
            --output-root work/official-morning \
            --cache-root work/official-morning-cache \
            --boaters-root work/official-boaters/work/races \
            --course-db data/player_course_6m/player_course_6m.sqlite \
            --course-class-cache data/player_course_6m/racer_classes.json \
            --min-interval 1.0 --timeout 25
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Confirm repository data was not modified
        shell: bash
        run: test -z "$(git status --short -- data automation .github)"
      - name: Upload isolated validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-official-validation-${{ inputs.date }}
          path: |
            work/official-detection/report.json
            work/official-morning/report.json
            work/official-morning/candidates/**/*.json
            work/official-morning-cache/**/*.json
            work/official-boaters/work/races/**
          if-no-files-found: warn
          retention-days: 7
      - name: Save successful official race cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/official-morning-cache
          key: official-morning-${{ inputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail incomplete validation after preserving diagnostics
        if: always() && (steps.supplement.outputs.exit_code != '0' || steps.final.outputs.exit_code != '0')
        run: exit 1
