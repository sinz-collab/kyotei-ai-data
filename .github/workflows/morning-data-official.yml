name: 朝のレースデータ【公式出走表】

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Validation date (YYYY-MM-DD)"
        required: true
        default: "2026-11-18"
        type: string
      venues:
        description: "Comma-separated validation venues"
        required: true
        default: "kiryu,tokoname"
        type: string
      races:
        description: "Comma-separated race numbers; use 1..12 only after permission review"
        required: true
        default: "1,12"
        type: string

permissions:
  contents: read

concurrency:
  group: morning-official-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Build isolated official candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard manual validation inputs
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
          TARGET_VENUES: ${{ inputs.venues }}
          TARGET_RACES: ${{ inputs.races }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$(date -d "$TARGET_DATE" +%F 2>/dev/null)" = "$TARGET_DATE"
          [[ "$TARGET_VENUES" =~ ^[a-z]+(,[a-z]+)*$ ]]
          [[ "$TARGET_RACES" =~ ^([1-9]|1[0-2])(,([1-9]|1[0-2]))*$ ]]
      - name: Install parser dependency
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Fetch and validate official candidates
        env:
          TARGET_DATE: ${{ inputs.date }}
          TARGET_VENUES: ${{ inputs.venues }}
          TARGET_RACES: ${{ inputs.races }}
        run: |
          python automation/official_morning.py \
            --date "$TARGET_DATE" \
            --venues "$TARGET_VENUES" \
            --races "$TARGET_RACES" \
            --baseline-root data/venues \
            --output-root work/official-morning \
            --min-interval 1.0 \
            --timeout 25
      - name: Confirm repository data was not modified
        shell: bash
        run: |
          test -z "$(git status --short -- data automation .github ':!automation/official_morning.py' ':!.github/workflows/morning-data-official.yml')"
      - name: Upload validation report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-official-validation-${{ inputs.date }}
          path: |
            work/official-morning/report.json
            work/official-morning/candidates/**/*.json
          if-no-files-found: warn
          retention-days: 7
