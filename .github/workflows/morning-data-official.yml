name: 朝のレースデータ【公式出走表】

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Validation date (YYYY-MM-DD)"
        required: true
        default: "2026-11-18"
        type: string
      supplement_venue:
        description: "Optional BOATERS supplement venue slug (one venue only)"
        required: false
        default: ""
        type: string
      supplement_races:
        description: "Optional comma-separated missing races (maximum three)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: morning-official-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Build isolated official candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard manual validation inputs
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$(date -d "$TARGET_DATE" +%F 2>/dev/null)" = "$TARGET_DATE"
          if [ -n "${{ inputs.supplement_venue }}${{ inputs.supplement_races }}" ]; then
            test -n "${{ inputs.supplement_venue }}"
            [[ "${{ inputs.supplement_venue }}" =~ ^(kiryu|toda|heiwajima|tokoname|biwako|naruto|shimonoseki|wakamatsu|ashiya|fukuoka|karatsu|omura)$ ]]
            [[ "${{ inputs.supplement_races }}" =~ ^([1-9]|1[0-2])(,([1-9]|1[0-2])){0,2}$ ]]
          fi
      - name: Configure pinned VPS SSH host for optional supplements
        if: inputs.supplement_venue != ''
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          VPS_KEY: ${{ secrets.MORNING_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.MORNING_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/morning-vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/morning-vps" "$HOME/.ssh/known_hosts"
          test -n "$VPS_HOST"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Retrieve only requested BOATERS supplements
        if: inputs.supplement_venue != ''
        shell: bash
        env:
          VPS_HOST: ${{ secrets.MORNING_VPS_HOST }}
          TARGET_DATE: ${{ inputs.date }}
          VENUE: ${{ inputs.supplement_venue }}
          RACES: ${{ inputs.supplement_races }}
        run: |
          expected="$(printf 'executor=%s\nboaters=%s\n' \
            "$(sha256sum deploy/morning-vps/sinz-morning-exec | awk '{print $1}')" \
            "$(sha256sum automation/boaters_fetch.py | awk '{print $1}')")"
          actual="$(ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "sinz-morning-gateway@$VPS_HOST" supplement-version)"
          [ "$actual" = "$expected" ]
          mkdir -p work/official-boaters
          timeout --signal=TERM --kill-after=20s 780s \
            ssh -i "$HOME/.ssh/morning-vps" -o BatchMode=yes \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "sinz-morning-gateway@$VPS_HOST" \
              "supplement $TARGET_DATE $VENUE $RACES" > "$RUNNER_TEMP/official-boaters.tgz"
          tar -xzf "$RUNNER_TEMP/official-boaters.tgz" -C work/official-boaters
      - name: Install parser dependency
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Restore successful official race cache
        uses: actions/cache/restore@v4
        with:
          path: work/official-morning-cache
          key: official-morning-${{ inputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            official-morning-${{ inputs.date }}-
      - name: Fetch and validate official candidates
        id: fetch
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set +e
          python automation/official_morning.py \
            --date "$TARGET_DATE" \
            --venues all \
            --races all \
            --baseline-root data/venues \
            --output-root work/official-morning \
            --cache-root work/official-morning-cache \
            --boaters-root work/official-boaters/work/races \
            --min-interval 1.0 \
            --timeout 25
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Confirm repository data was not modified
        shell: bash
        run: |
          test -z "$(git status --short -- data automation .github ':!automation/official_morning.py' ':!.github/workflows/morning-data-official.yml')"
      - name: Upload validation report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-official-validation-${{ inputs.date }}
          path: |
            work/official-morning/report.json
            work/official-morning/candidates/**/*.json
            work/official-morning-cache/**/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save successful race cache for missing-race retry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/official-morning-cache
          key: official-morning-${{ inputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail incomplete validation after preserving diagnostics
        if: always() && steps.fetch.outputs.exit_code != '0'
        run: exit 1
