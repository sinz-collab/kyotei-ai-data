name: 朝データ公開のみ再開

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: morning-race-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - id: source
        name: Find latest complete source artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const targetDate = process.env.TARGET_DATE;
            const parsedDate = new Date(`${targetDate}T00:00:00Z`);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate) ||
                Number.isNaN(parsedDate.getTime()) ||
                parsedDate.toISOString().slice(0, 10) !== targetDate) {
              core.setFailed(`Invalid target date: ${targetDate}`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const required = [
              `morning-east-${targetDate}`,
              `morning-west-${targetDate}`,
            ];

            let sourceRunId = null;
            for await (const response of github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'morning-data.yml',
                branch: 'main',
                per_page: 100,
              }
            )) {
              for (const run of response.data) {
                if (run.status !== 'completed') continue;
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  {owner, repo, run_id: run.id, per_page: 100}
                );
                const valid = required.every(name => {
                  const matches = artifacts.filter(artifact => artifact.name === name);
                  return matches.length === 1 &&
                    !matches[0].expired &&
                    matches[0].size_in_bytes > 0;
                });
                if (valid) {
                  sourceRunId = run.id;
                  break;
                }
              }
              if (sourceRunId !== null) break;
            }

            if (sourceRunId === null) {
              core.setFailed(
                `No completed Morning race data run has both valid artifacts for ${targetDate}.`
              );
              return;
            }
            core.setOutput('run_id', sourceRunId.toString());
            core.summary
              .addHeading('朝データ公開のみ再開')
              .addRaw(`Target date: ${targetDate}\n`)
              .addRaw(`Source Run ID: ${sourceRunId}\n`)
              .write();

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prediction dependencies
        run: |
          python -m pip install lxml==6.0.0
          python -m pip install -r engines/ashiya/ashiya_engine_v1_6/requirements.txt

      - name: Download east shard artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: morning-east-${{ inputs.target_date }}
          path: work/artifacts/east
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Download west shard artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: morning-west-${{ inputs.target_date }}
          path: work/artifacts/west
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate and merge source artifacts
        shell: bash
        run: |
          python automation/prepare_morning_artifacts.py \
            --date "$TARGET_DATE" \
            --east work/artifacts/east \
            --west work/artifacts/west \
            --output work/races

      - name: Validate and publish public data
        shell: bash
        run: bash automation/publish_morning_data.sh "$TARGET_DATE"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-resume-report-${{ inputs.target_date }}-${{ github.run_id }}
          path: |
            build-*.log
            data/morning_report.json
            work/races/**/fetch_status.json
          if-no-files-found: warn
          retention-days: 2
