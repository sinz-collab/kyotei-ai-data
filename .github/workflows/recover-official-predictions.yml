name: 公式予想・潮汐欠損復旧（出走表再取得なし）

on:
  # JST 06:45 and 08:25; no race-card fetching, tide-only recovery allowed.
  schedule:
    - cron: "45 21 * * *"
    - cron: "25 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "JST date (YYYY-MM-DD); blank means today"
        required: false
        default: ""
        type: string
  push:
    paths:
      - '.github/workflows/recover-official-predictions.yml'

permissions:
  contents: write

concurrency:
  group: morning-official-publish
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-official-prediction-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Guard JST today and main
        env:
          REQUESTED_DATE: "${{ inputs.date }}"
        run: |
          test "$GITHUB_REF" = refs/heads/main
          TARGET_DATE="${REQUESTED_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$(date -d "$TARGET_DATE" +%F 2>/dev/null)" = "$TARGET_DATE"
          test "$TARGET_DATE" = "$(TZ=Asia/Tokyo date +%F)"
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
      - name: Install existing engine dependencies
        run: |
          python -m pip install beautifulsoup4==4.13.4 lxml==6.0.0
          python -m pip install lhafile==0.3.1 catboost==1.2.10
          python -m pip install lightgbm==4.6.0 scikit-learn==1.8.0
      - name: Verify replay protections
        run: python -m unittest tests.test_official_prediction_stages tests.test_official_morning -q
      - name: Generate only predictions for open races
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          mkdir -p work
          python automation/restore_morning_tides.py --date "$TARGET_DATE" \
            | tee work/tide-recovery.json
          python automation/run_official_predictions.py --date "$TARGET_DATE" --stage official \
            | tee work/prediction-recovery-official.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('work/prediction-recovery-official.json').read_text())
          failed={name:status for name,status in result['venues'].items()
                  if name in ('naruto','ashiya','shimonoseki') and str(status).startswith(('engine_failed:', 'prediction_invalid:'))}
          if failed:
              raise SystemExit(f'Official prediction engines failed: {failed}')
          PY
          python automation/run_official_predictions.py --date "$TARGET_DATE" --stage supplement \
            | tee work/prediction-recovery-supplement.json
          python automation/repair_event_labels.py --date "$TARGET_DATE" \
            | tee work/event-label-recovery.json
          git add data/manifest.json data/morning_report.json \
            data/venues/kiryu data/venues/toda data/venues/heiwajima \
            data/venues/biwako data/venues/naruto data/venues/ashiya \
            data/venues/fukuoka data/venues/omura data/venues/shimonoseki
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "data: recover missing official predictions for $TARGET_DATE"
            RECOVERY_COMMIT="$(git rev-parse HEAD)"
            published=false
            for attempt in 1 2 3; do
              git fetch origin main
              git switch --detach origin/main
              python automation/replay_official_recovery.py \
                --candidate "$RECOVERY_COMMIT" --date "$TARGET_DATE"
              git add data/manifest.json data/morning_report.json data/venues
              git diff --cached --check
              if git diff --cached --quiet; then
                published=true
                break
              fi
              git commit -m "data: safely replay recovered predictions for $TARGET_DATE"
              if git push origin HEAD:main; then
                published=true
                break
              fi
              echo "LIVE advanced during recovery publication; replaying on latest main (attempt $attempt)"
            done
            test "$published" = true
          fi
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-prediction-recovery-${{ github.run_id }}
          path: |
            work/prediction-recovery-*.json
            work/event-label-recovery.json
            work/tide-recovery.json
          if-no-files-found: ignore
          retention-days: 7
