name: 公式出走表から予想のみ復旧（再取得なし）

on:
  workflow_dispatch:
    inputs:
      date:
        description: "JST date (YYYY-MM-DD); blank means today"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: morning-official-publish
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Guard JST today and main
        env:
          REQUESTED_DATE: "${{ inputs.date }}"
        run: |
          test "$GITHUB_REF" = refs/heads/main
          TARGET_DATE="${REQUESTED_DATE:-$(TZ=Asia/Tokyo date +%F)}"
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test "$(date -d "$TARGET_DATE" +%F 2>/dev/null)" = "$TARGET_DATE"
          test "$TARGET_DATE" = "$(TZ=Asia/Tokyo date +%F)"
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
      - name: Install existing engine dependencies
        run: |
          python -m pip install beautifulsoup4==4.13.4 lxml==6.0.0
          python -m pip install lhafile==0.3.1 catboost==1.2.10
      - name: Verify replay protections
        run: python -m unittest tests.test_official_prediction_stages tests.test_official_morning -q
      - name: Generate only predictions for open races
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          mkdir -p work
          python automation/run_official_predictions.py --date "$TARGET_DATE" --stage official \
            | tee work/prediction-recovery-official.json
          python automation/run_official_predictions.py --date "$TARGET_DATE" --stage supplement \
            | tee work/prediction-recovery-supplement.json
          git add data/manifest.json data/morning_report.json \
            data/venues/kiryu data/venues/toda data/venues/heiwajima \
            data/venues/biwako data/venues/fukuoka data/venues/omura
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "data: recover missing official predictions for $TARGET_DATE"
            git push origin HEAD:main
          fi
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-prediction-recovery-${{ github.run_id }}
          path: work/prediction-recovery-*.json
          if-no-files-found: ignore
          retention-days: 7
